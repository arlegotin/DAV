name: CPU tests and evidence replay

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # https://github.com/actions/checkout/releases/tag/v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # https://github.com/actions/setup-python/releases/tag/v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CPU dependencies and editable source
        run: |
          python -m pip install -r requirements-core.lock
          python -m pip install --no-build-isolation --no-deps -e '.[dev]'
          python -m pip check
      - name: Verify mathematical controls, implementation and published evidence
        run: |
          python -m depverify doctor --fake
          python -m depverify simulate --suite core
          python examples/copied_evidence.py
          python examples/replay_pilots.py
          python -m pytest -q
